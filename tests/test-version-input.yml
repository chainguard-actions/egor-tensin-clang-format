name: Test version input - uses clang-format-<version> binary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y powershell

      - name: Install clang-format and expose it as clang-format-99
        run: |
          sudo apt-get install -y clang-format
          REAL="$(command -v clang-format)"
          echo "real clang-format: $REAL"
          # Wrapper that records it was invoked, proving the version suffix is honored
          sudo tee /usr/local/bin/clang-format-99 > /dev/null <<EOF
          #!/bin/sh
          echo invoked >> /tmp/clang-format-99-invoked
          exec "$REAL" "\$@"
          EOF
          sudo chmod +x /usr/local/bin/clang-format-99
          rm -f /tmp/clang-format-99-invoked
          clang-format-99 --version

      - id: action
        uses: .
        with:
          version: '99'
          style: file
        continue-on-error: true

      - name: Assert clang-format-99 was used and diff produced
        env:
          ACTUAL: ${{ steps.action.outputs.diff }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual diff (raw): $ACTUAL"
          if [ "$OUTCOME" != "failure" ] && [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ ! -s /tmp/clang-format-99-invoked ]; then
            echo "FAIL: clang-format-99 was never invoked; version input ignored"
            exit 1
          fi
          echo "clang-format-99 invocations: $(wc -l < /tmp/clang-format-99-invoked)"
          DECODED="$(printf '%s' "$ACTUAL" | sed 's/%0A/\n/g; s/%0D/\r/g; s/%25/%/g')"
          echo "decoded diff:"
          echo "$DECODED"
          if echo "$DECODED" | grep -q '^---'; then
            echo "PASS: version-suffixed binary used and diff produced"
          else
            echo "FAIL: expected diff markers in decoded output"
            exit 1
          fi
