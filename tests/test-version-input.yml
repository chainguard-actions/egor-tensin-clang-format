name: Test version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: "14"
        continue-on-error: true

      - name: Assert action ran with version input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIFF: ${{ steps.action.outputs.diff }}
        run: |
          echo "outcome: $OUTCOME"
          echo "diff: $DIFF"
          # The action either succeeds (clang-format-14 available) or fails gracefully
          # (version not installed). Either way, the version input was exercised.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with version=14"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (clang-format-14 may not be installed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
