name: Test version input - uses clang-format-<version>
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y powershell

      - name: Install clang-format
        run: |
          sudo apt-get install -y clang-format

      - name: Detect installed clang-format major version
        id: ver
        run: |
          CF="$(command -v clang-format)"
          echo "clang-format at: $CF"
          clang-format --version
          V="$(ls /usr/bin/clang-format-[0-9]* 2>/dev/null | sed 's|.*/clang-format-||' | grep -E '^[0-9]+$' | sort -n | tail -1)"
          if [ -z "$V" ]; then
            V="$(clang-format --version | grep -oE '[0-9]+\.[0-9]+' | head -1 | cut -d. -f1)"
          fi
          if ! command -v "clang-format-$V" >/dev/null 2>&1; then
            sudo ln -sf "$CF" "/usr/local/bin/clang-format-$V"
          fi
          command -v "clang-format-$V"
          echo "version: $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        with:
          version: ${{ steps.ver.outputs.v }}
          style: file
        continue-on-error: true

      - name: Assert versioned clang-format ran and produced a diff
        env:
          ACTUAL: ${{ steps.action.outputs.diff }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual diff (raw):"
          echo "$ACTUAL"
          if [ "$OUTCOME" != "failure" ] && [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          DECODED="$(printf '%s' "$ACTUAL" | sed 's/%0A/\n/g; s/%0D/\r/g; s/%25/%/g')"
          echo "decoded diff:"
          echo "$DECODED"
          if echo "$DECODED" | grep -q '^---'; then
            echo "PASS: diff markers found using versioned clang-format"
          else
            echo "FAIL: expected diff markers in decoded output but got: $DECODED"
            exit 1
          fi
