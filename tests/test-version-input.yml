name: Test version input - uses clang-format-<version>
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y powershell

      - name: Install clang-format and determine major version
        id: ver
        run: |
          sudo apt-get install -y clang-format
          clang-format --version
          V="$(clang-format --version | grep -oE 'version [0-9]+' | grep -oE '[0-9]+' | head -n1)"
          echo "major version: $V"
          if [ -z "$V" ]; then
            echo "FAIL: could not determine clang-format version"
            exit 1
          fi
          if ! command -v "clang-format-$V" >/dev/null 2>&1; then
            sudo ln -sf "$(command -v clang-format)" "/usr/local/bin/clang-format-$V"
          fi
          "clang-format-$V" --version
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        with:
          version: ${{ steps.ver.outputs.v }}
          style: file
        continue-on-error: true

      - name: Assert versioned clang-format was used and produced a diff
        env:
          ACTUAL: ${{ steps.action.outputs.diff }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual diff (raw):"
          echo "$ACTUAL"
          if [ "$OUTCOME" != "failure" ] && [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          DECODED="$(printf '%s' "$ACTUAL" | sed 's/%0A/\n/g; s/%0D/\r/g; s/%25/%/g')"
          echo "decoded diff:"
          echo "$DECODED"
          if echo "$DECODED" | grep -q '^---'; then
            echo "PASS: diff produced using versioned clang-format"
          else
            echo "FAIL: expected diff markers in decoded output but got: $DECODED"
            exit 1
          fi
