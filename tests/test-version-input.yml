name: Test version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install clang-format-14
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-14

      - name: Create a pre-formatted C file
        run: |
          cat > "$GITHUB_WORKSPACE/hello.c" << 'EOF'
          int main(void) {
            return 0;
          }
          EOF

      - id: action
        uses: .
        with:
          version: "14"
          style: llvm

      - name: Assert diff output exists (action ran successfully)
        env:
          DIFF: ${{ steps.action.outputs.diff }}
        run: |
          echo "diff output: '$DIFF'"
          echo "PASS: action completed with version input set"
