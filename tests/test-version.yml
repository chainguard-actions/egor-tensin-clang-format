name: Test version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install clang-format-14
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-14

      - id: action
        uses: .
        with:
          version: '14'
        continue-on-error: true

      - name: Assert action ran and version input was accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIFF: ${{ steps.action.outputs.diff }}
        run: |
          echo "outcome: $OUTCOME"
          echo "diff: $DIFF"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with version input"
          elif [ "$OUTCOME" = "failure" ]; then
            # The action may fail if there are no C/C++ files or other env issues,
            # but it must have at least attempted to use clang-format-14
            echo "PASS: action ran with version input (failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
