name: Test clang-format with explicit version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell and clang-format
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q powershell clang-format

      - name: Create versioned clang-format-99 wrapper
        run: |
          REAL="$(command -v clang-format)"
          echo "real clang-format: $REAL"
          rm -f /tmp/clang-format-99-called
          sudo tee /usr/local/bin/clang-format-99 > /dev/null <<EOF
          #!/bin/sh
          echo called >> /tmp/clang-format-99-called
          exec "$REAL" "\$@"
          EOF
          sudo chmod +x /usr/local/bin/clang-format-99
          clang-format-99 --version
          rm -f /tmp/clang-format-99-called

      - id: action
        uses: .
        with:
          version: "99"
          style: file
          exclude: test/chromium.cpp

      - name: Assert versioned clang-format binary was used
        env:
          DIFF: ${{ steps.action.outputs.diff }}
        run: |
          echo "diff: '$DIFF'"
          if [ ! -s /tmp/clang-format-99-called ]; then
            echo "FAIL: clang-format-99 was never invoked; version input ignored"
            exit 1
          fi
          echo "clang-format-99 invocations: $(wc -l < /tmp/clang-format-99-called)"
          if echo "$DIFF" | grep -qE '^(---|[+][+][+]|@@)'; then
            echo "FAIL: expected no formatting diff but got: $DIFF"
            exit 1
          fi
          echo "PASS: version input selected clang-format-99"
