name: Test clang-format version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell and clang-format, expose a versioned binary
        run: |
          sudo apt-get update -q
          sudo apt-get install -y powershell clang-format
          # The action invokes "clang-format-<version>" when version is set.
          # Provide a deterministic versioned name pointing at the installed binary.
          sudo ln -sf "$(readlink -f "$(command -v clang-format)")" /usr/local/bin/clang-format-99
          clang-format-99 --version

      - id: action
        uses: .
        with:
          version: '99'
          style: file
          exclude: test/chromium.cpp:cmake

      - name: Assert versioned clang-format ran with no formatting diff
        env:
          DIFF: ${{ steps.action.outputs.diff }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "diff output: '$DIFF'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success, got $OUTCOME"
            exit 1
          fi
          ACTUAL_DIFF="$(echo "$DIFF" | grep -v '| INFO |' | grep -v '^$' || true)"
          if [ -n "$ACTUAL_DIFF" ] && echo "$ACTUAL_DIFF" | grep -qE '^(---|\+\+\+|@@)'; then
            echo "FAIL: expected no diff but got: $ACTUAL_DIFF"
            exit 1
          fi
          echo "PASS: version input honored (clang-format-99 used) with no diff"
