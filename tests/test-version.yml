name: Test version input - uses clang-format-<version> binary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install clang-format and PowerShell, expose as clang-format-99
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format powershell
          sudo ln -sf "$(command -v clang-format)" /usr/local/bin/clang-format-99
          clang-format-99 --version

      - id: action
        uses: .
        with:
          version: "99"
          style: file
        continue-on-error: true

      - name: Assert diff produced using versioned binary
        env:
          ACTUAL: ${{ steps.action.outputs.diff }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual diff: $ACTUAL"
          if echo "$ACTUAL" | grep -qF -- '--- '; then
            echo "PASS: diff markers found"
          elif echo "$ACTUAL" | grep -qF -- '%0A--- '; then
            echo "PASS: diff markers found (%0A-encoded)"
          else
            echo "FAIL: expected a diff with '---' markers but got: $ACTUAL"
            exit 1
          fi
