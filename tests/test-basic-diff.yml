name: Test basic usage - diff produced
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install clang-format and PowerShell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format powershell

      - id: action
        uses: .
        with:
          style: file
        continue-on-error: true

      - name: Assert diff is non-empty (chromium.cpp has 2-space indent, .clang-format requires 4)
        env:
          ACTUAL: ${{ steps.action.outputs.diff }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual diff: $ACTUAL"
          # The action exits with code 1 when formatting differences are found.
          # The diff output may have newlines encoded as %0A (from PowerShell encoding).
          # Check for actual diff markers either as literal text or %0A-encoded.
          if echo "$ACTUAL" | grep -qF '--- '; then
            echo "PASS: diff markers found (--- present)"
          elif echo "$ACTUAL" | grep -qF '%0A--- '; then
            echo "PASS: diff markers found (%0A-encoded)"
          else
            echo "FAIL: expected a diff with '---' markers but got: $ACTUAL"
            exit 1
          fi
